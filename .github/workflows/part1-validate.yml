name: Part 1 - Validate Repository Structure

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  validate-docs-folder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check /docs folder exists
        run: |
          if [ ! -d "docs" ]; then
            echo "::error::/docs folder is missing"
            exit 1
          fi
          echo "/docs folder found."

      - name: Check ERD file exists (PNG or PDF)
        run: |
          if ! ls docs/*.png docs/*.pdf 1> /dev/null 2>&1; then
            echo "::error::No ERD file (.png or .pdf) found in /docs"
            exit 1
          fi
          echo "ERD file found."

      - name: Check endpoint plan exists (PDF or Markdown)
        run: |
          if ! ls docs/*Endpoint*.md docs/*Endpoint*.pdf docs/*endpoint*.md docs/*endpoint*.pdf 1> /dev/null 2>&1; then
            echo "::error::No endpoint plan file found in /docs"
            exit 1
          fi
          echo "Endpoint plan file found."

      - name: Check SQL script exists
        run: |
          if ! ls docs/*.sql 1> /dev/null 2>&1; then
            echo "::error::No .sql file found in /docs"
            exit 1
          fi
          echo "SQL script found."

      - name: Check README exists
        run: |
          if [ ! -f "README.md" ]; then
            echo "::error::README.md is missing from the repository root"
            exit 1
          fi
          echo "README.md found."

      - name: All checks passed
        run: echo "Repository structure is valid for Part 1 submission."
